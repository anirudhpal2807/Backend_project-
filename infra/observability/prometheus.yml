global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "amrutam-api"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["api:3000"]
        labels:
          environment: "production"
          service: "amrutam-telemedicine-api"

  - job_name: "amrutam-worker"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["worker:3001"]
        labels:
          environment: "production"
          service: "amrutam-telemedicine-worker"
