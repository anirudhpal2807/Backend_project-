$kind: http-request
description: Verify MFA challenge with TOTP 6-digit code or backup code.
url: "{{baseUrl}}/api/v1/auth/mfa/verify-login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "mfaToken": "{{mfaToken}}",
      "code": "123456"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          var json = pm.response.json();
          if (json.accessToken) {
              pm.collectionVariables.set('accessToken', json.accessToken);
          }
          if (json.refreshToken) {
              pm.collectionVariables.set('refreshToken', json.refreshToken);
          }
      }
    language: text/javascript
order: 4000
