$kind: http-request
description: Register a new Doctor account.
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Idempotency-Key
    value: "{{$guid}}"
    description: Unique UUID to prevent duplicate registrations
body:
  type: json
  content: |-
    {
      "email": "doctor.ayur@example.com",
      "password": "DocPassword123!",
      "role": "DOCTOR"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
          var json = pm.response.json();
          if (json.accessToken) {
              pm.collectionVariables.set('accessToken', json.accessToken);
          }
          if (json.refreshToken) {
              pm.collectionVariables.set('refreshToken', json.refreshToken);
          }
          if (json.user && json.user.id) {
              pm.collectionVariables.set('userId', json.user.id);
          }
      }
    language: text/javascript
order: 2000
